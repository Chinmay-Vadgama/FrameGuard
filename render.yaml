services:
  - type: web
    name: FrameGuard
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: API_TOKEN
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: SCAN_TIMEOUT_SECONDS
        value: "120"
      - key: VIRUSTOTAL_ENABLED
        value: "false"
      - key: VIRUSTOTAL_UPLOAD_UNKNOWN
        value: "true"
      - key: VIRUSTOTAL_API_KEY
        sync: false
